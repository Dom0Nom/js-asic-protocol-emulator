# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"      # Project title
  author:       "Dom0Nom"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Tiny CPU with a timing-exact pin I/O ISA for bit-banging UART, SPI, I2C and more"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Competition allocation (see docs/competition/announcement.md)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dom0nom_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "tempo_core.v"
    - "tempo_lane.v"
    - "tempo_host.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "IN8: general input"
  ui[1]: "IN9: general input"
  ui[2]: "IN10: general input"
  ui[3]: "IN11: general input"
  ui[4]: "IN12: general input"
  ui[5]: "HMOSI: host SPI data in"
  ui[6]: "HSCK: host SPI clock"
  ui[7]: "HCS_N: host SPI chip select"

  # Outputs
  uo[0]: "OUT8: general output"
  uo[1]: "OUT9: general output"
  uo[2]: "OUT10: general output"
  uo[3]: "OUT11: general output"
  uo[4]: "OUT12: general output"
  uo[5]: "OUT13: general output"
  uo[6]: "OUT14: general output"
  uo[7]: "HMISO: host SPI data out"

  # Bidirectional pins
  uio[0]: "IO0: general bidirectional pin"
  uio[1]: "IO1: general bidirectional pin"
  uio[2]: "IO2: general bidirectional pin"
  uio[3]: "IO3: general bidirectional pin"
  uio[4]: "IO4: general bidirectional pin"
  uio[5]: "IO5: general bidirectional pin"
  uio[6]: "IO6: general bidirectional pin"
  uio[7]: "IO7: general bidirectional pin"

# Do not change!
yaml_version: 6
